name: leotrade
description: "LeoTrade — trading assisté par intelligence artificielle."
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.10.4

# Aucune génération de code : les modèles sont écrits à la main, et
# `freezed` / `json_serializable` / `riverpod_generator` ont été retirés —
# ils étaient déclarés depuis l'origine sans qu'un seul fichier .g.dart ou
# .freezed.dart n'ait jamais été produit. `local_auth` aussi, dont le
# commentaire « Biométrie pour la reprise de session » annonçait une
# fonctionnalité qui n'existe nulle part dans lib/ (et qui injectait
# USE_BIOMETRIC et USE_FINGERPRINT dans le manifeste livré).
dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

  # État et injection
  flutter_riverpod: ^2.6.1

  # Réseau
  dio: ^5.7.0
  # Les jetons ne vont jamais dans SharedPreferences : Keychain / Keystore.
  flutter_secure_storage: ^9.2.2
  web_socket_channel: ^3.0.1

  # Navigation
  go_router: ^14.6.2

  # Formatage (devises, dates) — locale fr
  intl: ^0.20.2

  cupertino_icons: ^1.0.8

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0
  # Socket simulée dans test/leo_protocol_test.dart. Déclarée explicitement
  # plutôt que reprise de web_socket_channel : une dépendance transitive
  # peut changer de version sans prévenir.
  stream_channel: ^2.1.2

flutter:
  uses-material-design: true
