version: "3.9"

services:
  traefik:
    image: traefik:v3.1
    restart: unless-stopped
    command:
      - --api.dashboard=true
      - --api.insecure=false
      - --providers.docker=true
      - --providers.docker.exposedbydefault=false
      - --entrypoints.web.address=:80
      - --entrypoints.websecure.address=:443
      - --ping=true
      - --accesslog=true
      - --log.level=INFO
      - --certificatesresolvers.le.acme.tlschallenge=true
      - --certificatesresolvers.le.acme.email=${TRAEFIK_ACME_EMAIL}
      - --certificatesresolvers.le.acme.storage=/letsencrypt/acme.json
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - traefik_letsencrypt:/letsencrypt
    networks:
      - proxy
      - internal
    healthcheck:
      test: ["CMD", "traefik", "healthcheck", "--ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  db:
    image: postgres:16
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - internal
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7
    restart: unless-stopped
    volumes:
      - redis_data:/data
    networks:
      - internal
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  web:
    build: .
    restart: unless-stopped
    command: >
      gunicorn leoTrade.asgi:application
      -k uvicorn.workers.UvicornWorker
      -b 0.0.0.0:8000
      --workers 2
      --timeout 120
      --access-logfile -
      --error-logfile -
    env_file:
      - .env.prod
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - static_volume:/app/staticfiles
      - media_volume:/app/media
    networks:
      - proxy
      - internal
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://127.0.0.1:8000/health/ready/ || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 5
    labels:
      - traefik.enable=true

      # Router HTTP -> HTTPS
      - traefik.http.routers.leotrade-web-http.rule=Host(`${TRAEFIK_APP_HOST}`)
      - traefik.http.routers.leotrade-web-http.entrypoints=web
      - traefik.http.routers.leotrade-web-http.middlewares=leotrade-https-redirect

      - traefik.http.middlewares.leotrade-https-redirect.redirectscheme.scheme=https
      - traefik.http.middlewares.leotrade-https-redirect.redirectscheme.permanent=true

      # Router HTTPS
      - traefik.http.routers.leotrade-web.rule=Host(`${TRAEFIK_APP_HOST}`)
      - traefik.http.routers.leotrade-web.entrypoints=websecure
      - traefik.http.routers.leotrade-web.tls=true
      - traefik.http.routers.leotrade-web.tls.certresolver=le
      - traefik.http.routers.leotrade-web.service=leotrade-web-svc

      # Service
      - traefik.http.services.leotrade-web-svc.loadbalancer.server.port=8000

      # Security headers
      - traefik.http.middlewares.leotrade-security.headers.stsSeconds=31536000
      - traefik.http.middlewares.leotrade-security.headers.stsIncludeSubdomains=true
      - traefik.http.middlewares.leotrade-security.headers.stsPreload=true
      - traefik.http.middlewares.leotrade-security.headers.browserXssFilter=true
      - traefik.http.middlewares.leotrade-security.headers.contentTypeNosniff=true
      - traefik.http.middlewares.leotrade-security.headers.frameDeny=true
      - traefik.http.middlewares.leotrade-security.headers.referrerPolicy=strict-origin-when-cross-origin
      - traefik.http.routers.leotrade-web.middlewares=leotrade-security

  worker:
    build: .
    restart: unless-stopped
    command: celery -A leoTrade worker -l info
    env_file:
      - .env.prod
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - internal

  beat:
    build: .
    restart: unless-stopped
    command: celery -A leoTrade beat -l info
    env_file:
      - .env.prod
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - internal

  flower:
    build: .
    restart: unless-stopped
    command: celery -A leoTrade flower --port=5555
    env_file:
      - .env.prod
    depends_on:
      redis:
        condition: service_healthy
    networks:
      - proxy
      - internal
    labels:
      - traefik.enable=true

      - traefik.http.routers.leotrade-flower-http.rule=Host(`${TRAEFIK_FLOWER_HOST}`)
      - traefik.http.routers.leotrade-flower-http.entrypoints=web
      - traefik.http.routers.leotrade-flower-http.middlewares=leotrade-flower-https-redirect

      - traefik.http.middlewares.leotrade-flower-https-redirect.redirectscheme.scheme=https
      - traefik.http.middlewares.leotrade-flower-https-redirect.redirectscheme.permanent=true

      - traefik.http.routers.leotrade-flower.rule=Host(`${TRAEFIK_FLOWER_HOST}`)
      - traefik.http.routers.leotrade-flower.entrypoints=websecure
      - traefik.http.routers.leotrade-flower.tls=true
      - traefik.http.routers.leotrade-flower.tls.certresolver=le
      - traefik.http.services.leotrade-flower-svc.loadbalancer.server.port=5555
      - traefik.http.routers.leotrade-flower.service=leotrade-flower-svc

networks:
  proxy:
    driver: bridge
  internal:
    driver: bridge

volumes:
  postgres_data:
  redis_data:
  static_volume:
  media_volume:
  traefik_letsencrypt: