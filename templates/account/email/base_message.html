<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block email_title %}Lyneci — Intelligent Trading{% endblock %}</title>
</head>
<body style="margin:0;padding:0;background:#080c14;color:#e5e7eb;font-family:Arial,Helvetica,sans-serif;">
  <div style="display:none;max-height:0;overflow:hidden;opacity:0;">{% block preheader %}Notification sécurisée Lyneci{% endblock %}</div>
  <table role="presentation" width="100%" cellpadding="0" cellspacing="0" style="background:#080c14;padding:32px 12px;">
    <tr>
      <td align="center">
        <table role="presentation" width="100%" cellpadding="0" cellspacing="0" style="max-width:560px;background:#0f1420;border:1px solid #253044;border-radius:16px;overflow:hidden;">
          <tr>
            <td style="padding:24px 28px;border-bottom:1px solid #253044;">
              <div style="font-size:21px;font-weight:700;color:#ffffff;">Lyneci</div>
              <div style="margin-top:4px;font-size:12px;letter-spacing:1.2px;text-transform:uppercase;color:#00ff9d;">Intelligent Trading</div>
            </td>
          </tr>
          <tr>
            <td style="padding:30px 28px;font-size:15px;line-height:1.7;color:#cbd5e1;">
              {% block content %}{% endblock %}
            </td>
          </tr>
          <tr>
            <td style="padding:20px 28px;border-top:1px solid #253044;font-size:12px;line-height:1.6;color:#718096;">
              Email automatique de sécurité — ne partagez jamais vos mots de passe, codes ou liens.<br>
              <a href="https://{{ current_site.domain }}" style="color:#00ff9d;text-decoration:none;">{{ current_site.domain }}</a>
            </td>
          </tr>
        </table>
      </td>
    </tr>
  </table>
</body>
</html>
