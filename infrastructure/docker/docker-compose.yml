x-app-image: &app-image
  image: ${APP_IMAGE:-leotrade:local}
  build:
    context: ../..
    dockerfile: infrastructure/docker/Dockerfile

x-app-environment: &app-environment
  DJANGO_ENV: prod
  POSTGRES_HOST: leotrade-db
  POSTGRES_PORT: "5432"
  REDIS_URL: redis://:${REDIS_PASSWORD:?REDIS_PASSWORD manquant}@leotrade-redis:6379/1
  CHANNELS_REDIS_URL: redis://:${REDIS_PASSWORD:?REDIS_PASSWORD manquant}@leotrade-redis:6379/2
  CELERY_BROKER_URL: redis://:${REDIS_PASSWORD:?REDIS_PASSWORD manquant}@leotrade-redis:6379/0
  CELERY_RESULT_BACKEND: redis://:${REDIS_PASSWORD:?REDIS_PASSWORD manquant}@leotrade-redis:6379/0

x-app-defaults: &app-defaults
  <<: *app-image
  env_file:
    - ${APP_ENV_FILE:-../deploy/.env.prod}
  environment: *app-environment
  init: true
  security_opt:
    - no-new-privileges:true
  networks:
    - internal
  logging:
    driver: json-file
    options:
      max-size: 10m
      max-file: "5"

services:
  leotrade-db:
    image: postgres:16
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:?POSTGRES_DB manquant}
      POSTGRES_USER: ${POSTGRES_USER:?POSTGRES_USER manquant}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD manquant}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - internal
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: "5"

  leotrade-redis:
    image: redis:7
    restart: unless-stopped
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD:?REDIS_PASSWORD manquant}
    command: >-
      sh -c 'exec redis-server --appendonly yes --appendfsync everysec
      --requirepass "$$REDIS_PASSWORD"'
    volumes:
      - redis_data:/data
    networks:
      - internal
    healthcheck:
      test: ["CMD-SHELL", "redis-cli -a \"$$REDIS_PASSWORD\" --no-auth-warning ping | grep -q PONG"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 10s
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: "5"

  leotrade-release:
    <<: *app-defaults
    restart: "no"
    command: >-
      sh -c 'python manage.py check --deploy --fail-level ERROR &&
      python manage.py migrate --noinput &&
      python manage.py configure_site_identity'
    depends_on:
      leotrade-db:
        condition: service_healthy
      leotrade-redis:
        condition: service_healthy

  leotrade-web:
    <<: *app-defaults
    restart: unless-stopped
    command: >-
      uvicorn leoTrade.asgi:application --host 0.0.0.0 --port 8000
      --workers ${WEB_CONCURRENCY:-2} --proxy-headers --forwarded-allow-ips=*
    depends_on:
      leotrade-release:
        condition: service_completed_successfully
    volumes:
      - media_volume:/app/media
    networks:
      - proxy
      - internal
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS -H \"Host: $$TRAEFIK_APP_HOST\" -H \"X-Forwarded-Proto: https\" http://127.0.0.1:8000/health/ready/ || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 45s
    stop_grace_period: 45s
    labels:
      - traefik.enable=true
      - traefik.docker.network=${TRAEFIK_NETWORK:-proxy}
      - traefik.http.routers.leotrade-web.rule=Host(`${TRAEFIK_APP_HOST:?TRAEFIK_APP_HOST manquant}`)
      - traefik.http.routers.leotrade-web.entrypoints=websecure
      - traefik.http.routers.leotrade-web.tls=true
      - traefik.http.routers.leotrade-web.tls.certresolver=${TRAEFIK_CERT_RESOLVER:-lets}
      - traefik.http.routers.leotrade-web.service=leotrade-web-svc
      - traefik.http.services.leotrade-web-svc.loadbalancer.server.port=8000
      - traefik.http.routers.leotrade-web.middlewares=leotrade-web-sec-headers@docker,${TRAEFIK_SHARED_MIDDLEWARES:-compress@docker,ratelimit@docker}
      - traefik.http.middlewares.leotrade-web-sec-headers.headers.stsSeconds=31536000
      - traefik.http.middlewares.leotrade-web-sec-headers.headers.stsIncludeSubdomains=true
      - traefik.http.middlewares.leotrade-web-sec-headers.headers.stsPreload=true
      - traefik.http.middlewares.leotrade-web-sec-headers.headers.frameDeny=true
      - traefik.http.middlewares.leotrade-web-sec-headers.headers.contentTypeNosniff=true
      - traefik.http.middlewares.leotrade-web-sec-headers.headers.referrerPolicy=strict-origin-when-cross-origin

  leotrade-worker:
    <<: *app-defaults
    restart: unless-stopped
    command: >-
      celery -A leoTrade worker -l info --hostname=leotrade-worker@%h --events
      --concurrency=${CELERY_WORKER_CONCURRENCY:-2}
    depends_on:
      leotrade-release:
        condition: service_completed_successfully
    volumes:
      - media_volume:/app/media
    healthcheck:
      test: ["CMD-SHELL", "celery -A leoTrade inspect ping -d leotrade-worker@$$HOSTNAME --timeout=5 | grep -q pong"]
      interval: 20s
      timeout: 10s
      retries: 8
      start_period: 45s
    stop_grace_period: 90s

  leotrade-beat:
    <<: *app-defaults
    restart: unless-stopped
    command: >-
      celery -A leoTrade beat -l info --pidfile=/tmp/celerybeat.pid
      --schedule=/tmp/celerybeat-schedule
    depends_on:
      leotrade-release:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD-SHELL", "test -s /tmp/celerybeat.pid && kill -0 $$(cat /tmp/celerybeat.pid)"]
      interval: 20s
      timeout: 5s
      retries: 8
      start_period: 30s
    stop_grace_period: 45s

  leotrade-flower:
    <<: *app-defaults
    restart: unless-stopped
    command: >-
      sh -c 'test -n "$$FLOWER_BASIC_AUTH" &&
      celery -A leoTrade flower --port=5555 --basic-auth="$$FLOWER_BASIC_AUTH"'
    depends_on:
      leotrade-worker:
        condition: service_healthy
    networks:
      - proxy
      - internal
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://127.0.0.1:5555/healthcheck >/dev/null"]
      interval: 20s
      timeout: 5s
      retries: 8
      start_period: 30s
    labels:
      - traefik.enable=true
      - traefik.docker.network=${TRAEFIK_NETWORK:-proxy}
      - traefik.http.routers.leotrade-flower.rule=Host(`${TRAEFIK_FLOWER_HOST:?TRAEFIK_FLOWER_HOST manquant}`)
      - traefik.http.routers.leotrade-flower.entrypoints=websecure
      - traefik.http.routers.leotrade-flower.tls=true
      - traefik.http.routers.leotrade-flower.tls.certresolver=${TRAEFIK_CERT_RESOLVER:-lets}
      - traefik.http.routers.leotrade-flower.service=leotrade-flower-svc
      - traefik.http.routers.leotrade-flower.middlewares=leotrade-flower-sec-headers@docker,${TRAEFIK_SHARED_MIDDLEWARES:-compress@docker,ratelimit@docker}
      - traefik.http.middlewares.leotrade-flower-sec-headers.headers.stsSeconds=31536000
      - traefik.http.middlewares.leotrade-flower-sec-headers.headers.stsIncludeSubdomains=true
      - traefik.http.middlewares.leotrade-flower-sec-headers.headers.stsPreload=true
      - traefik.http.middlewares.leotrade-flower-sec-headers.headers.frameDeny=true
      - traefik.http.middlewares.leotrade-flower-sec-headers.headers.contentTypeNosniff=true
      - traefik.http.middlewares.leotrade-flower-sec-headers.headers.referrerPolicy=strict-origin-when-cross-origin
      - traefik.http.services.leotrade-flower-svc.loadbalancer.server.port=5555

networks:
  proxy:
    external: true
    name: ${TRAEFIK_NETWORK:-proxy}
  internal:
    driver: bridge

volumes:
  postgres_data:
  redis_data:
  media_volume:
